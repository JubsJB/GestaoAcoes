server {
    listen 8443 ssl default_server;
    server_name gestaoacoes.localhost;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Comparação inclui porta pública; Origin recebido nunca é substituído.
    if ($http_host != "gestaoacoes.localhost:8443") { return 421; }
    root /usr/share/nginx/html;
    index index.html;
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host gestaoacoes.localhost:8443;
        proxy_set_header X-Forwarded-Host gestaoacoes.localhost;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect ~^https://gestaoacoes\.localhost:8443/(.*)$ https://gestaoacoes.localhost:8443/api/$1;
        proxy_redirect ~^/(?!api/)(.*)$ /api/$1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
