server {
    listen 8081 default_server;
    server_name localhost;
    server_tokens off;
    if ($http_host != "localhost:8081") { return 421; }
    root /usr/share/nginx/html;
    index index.html;

    location = /api { return 404; }
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8081;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-Port 8081;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Spring deve enxergar o endereço do proxy, sem substituição por IP do cliente.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect ~^http://localhost:8081/(.*)$ http://localhost:8081/api/$1;
        proxy_redirect ~^/(?!api/)(.*)$ /api/$1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
