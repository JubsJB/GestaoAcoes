name: Testes e cobertura

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Backend e frontend - cobertura
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          show-download-progress: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar npm
        run: |
          npm.cmd install --global npm@11.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar dependencias frontend
        working-directory: frontend
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar backend e frontend sequencialmente
        id: verify
        run: ./scripts/verify-coverage.ps1
      - name: Informar ausencia de execucao
        if: ${{ always() && steps.verify.outputs.evidence == '' }}
        run: |
          'Verificacao nao produziu evidencias: consulte a falha de preparacao ou cancelamento. Relatorios backend e frontend: AUSENTES.' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Publicar evidencias da execucao atual
        if: ${{ always() && steps.verify.outputs.evidence != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verify.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
