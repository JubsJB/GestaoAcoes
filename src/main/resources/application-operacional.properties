# Somente arquivos externos; import obrigatório, sem fallback para dev.
spring.config.import=configtree:/run/secrets/
spring.datasource.url=jdbc:postgresql://postgres:5432/${OP_DB_NAME}
spring.datasource.username=${OP_DB_APP_USER}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
auth.allow-local-http=false
auth.absolute-duration=PT4H
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${APP_TRUSTED_PROXY_IP}/32
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.redirect-context-root=false
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config
