databaseChangeLog:
  - changeSet:
      id: 007-add-referencia-temporal-cotacao
      author: codex
      changes:
        - addColumn:
            tableName: acao
            columns:
              - column:
                  name: referencia_tipo
                  type: VARCHAR(12)
                  defaultValue: DESCONHECIDA
                  constraints:
                    nullable: false
              - column:
                  name: referencia_instante
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: referencia_data
                  type: DATE
              - column:
                  name: cotacao_obtida_em
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: >-
              ALTER TABLE acao ADD CONSTRAINT ck_acao_referencia_temporal CHECK (
                (referencia_tipo = 'DESCONHECIDA' AND referencia_instante IS NULL AND referencia_data IS NULL) OR
                (referencia_tipo = 'DATA' AND referencia_data IS NOT NULL AND referencia_instante IS NULL) OR
                (referencia_tipo = 'INSTANTE' AND referencia_instante IS NOT NULL AND referencia_data IS NULL)
              )
        - addColumn:
            tableName: historico_cotacao
            columns:
              - column:
                  name: referencia_tipo
                  type: VARCHAR(12)
                  defaultValue: DESCONHECIDA
                  constraints:
                    nullable: false
              - column:
                  name: referencia_instante
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: referencia_data
                  type: DATE
              - column:
                  name: cotacao_obtida_em
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: >-
              ALTER TABLE historico_cotacao ADD CONSTRAINT ck_historico_cotacao_referencia_temporal CHECK (
                (referencia_tipo = 'DESCONHECIDA' AND referencia_instante IS NULL AND referencia_data IS NULL) OR
                (referencia_tipo = 'DATA' AND referencia_data IS NOT NULL AND referencia_instante IS NULL) OR
                (referencia_tipo = 'INSTANTE' AND referencia_instante IS NOT NULL AND referencia_data IS NULL)
              )
        - dropUniqueConstraint:
            tableName: historico_cotacao
            constraintName: uk_historico_cotacao_acao_data_hora
        - addUniqueConstraint:
            tableName: historico_cotacao
            columnNames: acao_id, referencia_instante
            constraintName: uk_historico_cotacao_acao_instante
        - addUniqueConstraint:
            tableName: historico_cotacao
            columnNames: acao_id, referencia_data
            constraintName: uk_historico_cotacao_acao_data
      rollback:
        # Restaurar primeiro: colisões no legado impedem rollback antes de remover metadados.
        # Mesmo no sucesso, o rollback estrutural descarta a informação temporal adicionada.
        - addUniqueConstraint:
            tableName: historico_cotacao
            columnNames: acao_id, data_hora_cotacao
            constraintName: uk_historico_cotacao_acao_data_hora
        - dropUniqueConstraint:
            tableName: historico_cotacao
            constraintName: uk_historico_cotacao_acao_instante
        - dropUniqueConstraint:
            tableName: historico_cotacao
            constraintName: uk_historico_cotacao_acao_data
        - sql:
            sql: ALTER TABLE historico_cotacao DROP CONSTRAINT ck_historico_cotacao_referencia_temporal
        - dropColumn:
            tableName: historico_cotacao
            columnName: cotacao_obtida_em
        - dropColumn:
            tableName: historico_cotacao
            columnName: referencia_data
        - dropColumn:
            tableName: historico_cotacao
            columnName: referencia_instante
        - dropColumn:
            tableName: historico_cotacao
            columnName: referencia_tipo
        - sql:
            sql: ALTER TABLE acao DROP CONSTRAINT ck_acao_referencia_temporal
        - dropColumn:
            tableName: acao
            columnName: cotacao_obtida_em
        - dropColumn:
            tableName: acao
            columnName: referencia_data
        - dropColumn:
            tableName: acao
            columnName: referencia_instante
        - dropColumn:
            tableName: acao
            columnName: referencia_tipo
