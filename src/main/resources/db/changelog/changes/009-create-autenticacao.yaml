databaseChangeLog:
  - changeSet:
      id: 009-create-autenticacao
      author: codex
      changes:
        - createTable:
            tableName: usuario
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_usuario
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: senha_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: papel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: ativo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: credencial_definida
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: versao_seguranca
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: versao
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: atualizada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: usuario
            columnNames: username
            constraintName: uk_usuario_username
        - sql:
            sql: >-
              ALTER TABLE usuario ADD CONSTRAINT ck_usuario_username CHECK
              (CHAR_LENGTH(username) BETWEEN 3 AND 100 AND NOT
              REGEXP_LIKE(username,
              '[^abcdefghijklmnopqrstuvwxyz0123456789._-]'));

              ALTER TABLE usuario ADD CONSTRAINT ck_usuario_papel CHECK (papel
              IN ('ADMIN','USER'));

              ALTER TABLE usuario ADD CONSTRAINT ck_usuario_versoes CHECK
              (versao_seguranca >= 0 AND versao >= 0);

              ALTER TABLE usuario ADD CONSTRAINT ck_usuario_datas CHECK
              (atualizada_em >= criada_em);

              ALTER TABLE usuario ADD CONSTRAINT ck_usuario_credencial CHECK
              ((NOT credencial_definida AND senha_hash IS NULL) OR
              (credencial_definida AND senha_hash IS NOT NULL AND
              REGEXP_LIKE(senha_hash,
              '^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')));
        - createTable:
            tableName: sessao_autenticacao
            columns:
              - column:
                  name: sid
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_sessao_autenticacao
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: versao_emitida
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ultima_atividade_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em_absoluto
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revogada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: motivo_revogacao
                  type: VARCHAR(30)
                  constraints:
                    nullable: true
              - column:
                  name: versao
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sessao_autenticacao
            baseColumnNames: usuario_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_sessao_usuario
            onDelete: RESTRICT
        - createIndex:
            tableName: sessao_autenticacao
            indexName: idx_sessao_usuario_expiracao
            columns:
              - column:
                  name: usuario_id
              - column:
                  name: expira_em_absoluto
        - sql:
            sql: >-
              ALTER TABLE sessao_autenticacao ADD CONSTRAINT ck_sessao_versoes
              CHECK (versao_emitida >= 0 AND versao >= 0);

              ALTER TABLE sessao_autenticacao ADD CONSTRAINT ck_sessao_prazos
              CHECK (ultima_atividade_em >= criada_em AND ultima_atividade_em <
              expira_em_absoluto);

              ALTER TABLE sessao_autenticacao ADD CONSTRAINT ck_sessao_revogacao
              CHECK ((revogada_em IS NULL AND motivo_revogacao IS NULL) OR
              (revogada_em IS NOT NULL AND revogada_em >= criada_em AND
              motivo_revogacao IS NOT NULL AND LENGTH(TRIM(motivo_revogacao)) >
              0));
        - createTable:
            tableName: controle_seguranca
            columns:
              - column:
                  name: id
                  type: SMALLINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_controle_seguranca
        - sql:
            sql: ALTER TABLE controle_seguranca ADD CONSTRAINT
              ck_controle_seguranca_singleton CHECK (id = 1)
        - insert:
            tableName: controle_seguranca
            columns:
              - column:
                  name: id
                  valueNumeric: 1
        - createTable:
            tableName: auditoria_usuario
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_auditoria_usuario
              - column:
                  name: ator_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: alvo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: acao
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: resultado
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: registrada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: auditoria_usuario
            baseColumnNames: ator_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_auditoria_ator
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: auditoria_usuario
            baseColumnNames: alvo_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_auditoria_alvo
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE auditoria_usuario ADD CONSTRAINT ck_auditoria_acao CHECK (acao
              IN
              ('BOOTSTRAP','CADASTRO','ALTERACAO_PERFIL','BLOQUEIO','HABILITACAO','AUTORIZACAO_REDEFINICAO','REDEFINICAO_SENHA'))
        - sql:
            sql: ALTER TABLE auditoria_usuario ADD CONSTRAINT ck_auditoria_resultado CHECK
              (resultado IN ('SUCESSO','RECUSADO'))
        - sql:
            sql: ALTER TABLE auditoria_usuario ADD CONSTRAINT ck_auditoria_ator CHECK
              ((acao='BOOTSTRAP' AND ator_id IS NULL) OR (acao<>'BOOTSTRAP' AND
              ator_id IS NOT NULL))
        - createIndex:
            tableName: auditoria_usuario
            indexName: idx_auditoria_alvo_instante
            columns:
              - column:
                  name: alvo_id
              - column:
                  name: registrada_em
        - createTable:
            tableName: autorizacao_redefinicao_senha
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_autorizacao_redefinicao_senha
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: autorizada_por_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: digest
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: motivo
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: tentativas_restantes
                  type: INTEGER
                  defaultValueNumeric: 5
                  constraints:
                    nullable: false
              - column:
                  name: consumida_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: invalidada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: versao
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: autorizacao_redefinicao_senha
            baseColumnNames: usuario_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_redefinicao_usuario
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: autorizacao_redefinicao_senha
            baseColumnNames: autorizada_por_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_redefinicao_autor
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE autorizacao_redefinicao_senha ADD CONSTRAINT
              ck_redefinicao_digest CHECK (CHAR_LENGTH(digest)=64 AND NOT
              REGEXP_LIKE(digest,'[^0123456789abcdef]'))
        - sql:
            sql: ALTER TABLE autorizacao_redefinicao_senha ADD CONSTRAINT
              ck_redefinicao_motivo CHECK (motivo IN ('INICIAL','REDEFINICAO'))
        - sql:
            sql: ALTER TABLE autorizacao_redefinicao_senha ADD CONSTRAINT
              ck_redefinicao_tentativas CHECK (tentativas_restantes BETWEEN 0
              AND 5 AND versao >= 0)
        - sql:
            sql: ALTER TABLE autorizacao_redefinicao_senha ADD CONSTRAINT
              ck_redefinicao_prazos CHECK (expira_em > criada_em AND
              (consumida_em IS NULL OR (consumida_em >= criada_em AND
              consumida_em < expira_em)) AND (invalidada_em IS NULL OR
              invalidada_em >= criada_em) AND (consumida_em IS NULL OR
              invalidada_em IS NULL))
        - createIndex:
            tableName: autorizacao_redefinicao_senha
            indexName: idx_redefinicao_usuario_expiracao
            columns:
              - column:
                  name: usuario_id
              - column:
                  name: expira_em
        - createTable:
            tableName: contador_abuso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_contador_abuso
              - column:
                  name: tipo
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: chave_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: inicio_janela
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: tentativas
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: versao
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: contador_abuso
            columnNames: tipo,chave_hash,inicio_janela
            constraintName: uk_contador_abuso_janela
        - sql:
            sql: ALTER TABLE contador_abuso ADD CONSTRAINT ck_contador_abuso_tipo CHECK
              (tipo IN
              ('LOGIN_IDENTIDADE_IP','LOGIN_IP','REDEFINICAO_IDENTIDADE_IP','REDEFINICAO_IP'))
        - sql:
            sql: ALTER TABLE contador_abuso ADD CONSTRAINT ck_contador_abuso_chave CHECK
              (CHAR_LENGTH(chave_hash)=64 AND NOT
              REGEXP_LIKE(chave_hash,'[^0123456789abcdef]'))
        - sql:
            sql: ALTER TABLE contador_abuso ADD CONSTRAINT ck_contador_abuso_estado CHECK
              (tentativas >= 0 AND versao >= 0 AND expira_em > inicio_janela)
        - createIndex:
            tableName: contador_abuso
            indexName: idx_contador_abuso_expiracao
            columns:
              - column:
                  name: expira_em
      rollback:
        - stop:
            message: Rollback de autenticação bloqueado para preservar identidades, sessões
              e auditoria. Exige plano separado e autorização explícita.
