databaseChangeLog:
  - changeSet:
      id: 002-create-acao
      author: codex
      changes:
        - createTable:
            tableName: acao
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_acao
                    nullable: false
              - column:
                  name: ticker
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: nome_empresa
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: mercado
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: moeda
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: cotacao_atual
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: data_hora_cotacao
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: acao
            columnNames: ticker, mercado
            constraintName: uk_acao_ticker_mercado
        - sql:
            sql: ALTER TABLE acao ADD CONSTRAINT ck_acao_mercado CHECK (mercado IN ('BRASIL', 'EUA'))
        - sql:
            sql: ALTER TABLE acao ADD CONSTRAINT ck_acao_moeda CHECK (moeda IN ('BRL', 'USD'))
        - sql:
            sql: ALTER TABLE acao ADD CONSTRAINT ck_acao_mercado_moeda CHECK ((mercado = 'BRASIL' AND moeda = 'BRL') OR (mercado = 'EUA' AND moeda = 'USD'))
        - sql:
            sql: ALTER TABLE acao ADD CONSTRAINT ck_acao_cotacao_positiva CHECK (cotacao_atual > 0)
      rollback:
        - dropTable:
            tableName: acao
            cascadeConstraints: true
