spring.application.name=gestaoacoes

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

integration.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
integration.brasil-api.connect-timeout=${BRASIL_API_CONNECT_TIMEOUT:2s}
integration.brasil-api.read-timeout=${BRASIL_API_READ_TIMEOUT:5s}

integration.via-cep.base-url=${VIA_CEP_BASE_URL:https://viacep.com.br}
integration.via-cep.connect-timeout=${VIA_CEP_CONNECT_TIMEOUT:2s}
integration.via-cep.read-timeout=${VIA_CEP_READ_TIMEOUT:5s}

integration.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}
integration.brapi.api-key=${BRAPI_API_KEY:}
integration.brapi.connect-timeout=${BRAPI_CONNECT_TIMEOUT:2s}
integration.brapi.read-timeout=${BRAPI_READ_TIMEOUT:5s}

integration.alpha-vantage.base-url=${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
integration.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
integration.alpha-vantage.connect-timeout=${ALPHA_VANTAGE_CONNECT_TIMEOUT:2s}
integration.alpha-vantage.read-timeout=${ALPHA_VANTAGE_READ_TIMEOUT:5s}

# Current US quotes only; no automatic polling or background refresh.
integration.alpha-vantage.quote-reuse-interval=${ALPHA_VANTAGE_QUOTE_REUSE_INTERVAL:15m}
integration.alpha-vantage.refresh-cooldown=${ALPHA_VANTAGE_REFRESH_COOLDOWN:15m}
