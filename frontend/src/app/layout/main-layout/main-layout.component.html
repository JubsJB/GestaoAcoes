<a class="skip-link" href="#main-content" (click)="focusMainContent()">Pular para o conteúdo</a>

<mat-toolbar class="app-toolbar">
  <div class="toolbar-content">
    @if (isCompact()) {
      <button
        matIconButton
        type="button"
        class="menu-button"
        aria-label="Abrir ou fechar menu principal"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="compactDrawerOpened()"
        (click)="toggleDrawer()"
      >
        <span aria-hidden="true">☰</span>
      </button>
    }

    <span class="app-brand" aria-label="Gestão de Ações">
      <span class="app-brand__mark" aria-hidden="true"><app-icon name="wallet" /></span>
      <span class="app-brand__copy"><strong>Gestão de Ações</strong><small>Investimentos com clareza</small></span>
    </span>
    <app-carteira-selector />
  </div>
</mat-toolbar>

<mat-sidenav-container class="shell-container" autosize (backdropClick)="closeCompactDrawer()">
  <mat-sidenav
    #drawer
    id="primary-navigation"
    class="app-sidenav"
    [class.app-sidenav--collapsed]="navigationCollapsed()"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="!isCompact() || compactDrawerOpened()"
    [disableClose]="!isCompact()"
    (keydown.escape)="closeCompactDrawer()"
  >
    @if (!isCompact()) {
      <div class="navigation-controls">
        <button
          matIconButton
          type="button"
          class="navigation-toggle"
          [attr.aria-label]="desktopCollapsed() ? 'Expandir navegação' : 'Recolher navegação'"
          [attr.title]="desktopCollapsed() ? 'Expandir navegação' : 'Recolher navegação'"
          aria-controls="primary-navigation"
          [attr.aria-expanded]="!desktopCollapsed()"
          (click)="toggleDesktopNavigation()"
        >
          <span aria-hidden="true">{{ desktopCollapsed() ? '»' : '«' }}</span>
        </button>
      </div>
    }
    <nav aria-label="Navegação principal">
      <mat-nav-list>
        @for (item of navigationItems; track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            [attr.aria-label]="item.label"
            [attr.title]="navigationCollapsed() ? item.label : null"
            (click)="closeCompactDrawer()"
            routerLinkActive="active-navigation-item"
            ariaCurrentWhenActive="page"
          >
            <app-icon matListItemIcon class="navigation-icon" [name]="item.icon" />
            <span matListItemTitle [class.navigation-label--hidden]="navigationCollapsed()">{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="workspace">
    <main #mainContent id="main-content" class="main-content" tabindex="-1">
      <div class="main-content__container">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
